name: Demo runtime
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - id: model
        run: echo "commit=$(cat iot-digital-twin-simulator/model-commit.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: usekarma/iot-digital-twin
          ref: ${{ steps.model.outputs.commit }}
          path: model-source
          persist-credentials: false
      - run: python -m pip install -r requirements-dev.txt
      - run: make test lint test-demo package-demo MODEL_REPO=model-source RUFF=ruff
      - run: PYTHONPATH=dist/iot-digital-twin-simulator.zip python -m unittest discover -s iot-digital-twin-simulator/tests -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iot-digital-twin-simulator-${{ github.sha }}
          path: dist/iot-digital-twin-simulator.zip
          retention-days: 14
